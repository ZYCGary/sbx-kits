# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
version: "0.2.0"
displayName: Laravel Sail build allowlist
description: Outbound allowlist for building the Laravel Sail runtime image in-sandbox.
sourceUrl: https://github.com/ZYCGary/sbx-kits
capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - laravel.com
          - keyserver.ubuntu.com
          - ppa.launchpadcontent.net
          - deb.nodesource.com
          - packages.sury.org
          - telemetry.meilisearch.com
          - getcomposer.org
          - www.postgresql.org
          - apt.postgresql.org
  - type: com.docker.sandbox/agent-context@1
    config:
      content: |
        ## Laravel Sail

        The outbound hosts the Sail runtime image needs at build time (ondrej PPA and
        its keyserver, nodesource, composer, pgdg) are allowlisted, so
        `./vendor/bin/sail build` works here. If a build step is still blocked, take
        the host from `sbx policy log`, not from the Dockerfile.
