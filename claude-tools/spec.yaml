schemaVersion: "2"
kind: mixin
name: claude-tools
version: 0.1.0
displayName: Claude agent tooling
description: Installs and initializes the tooling the Claude agent expects in-sandbox.
sourceURL: https://github.com/ZYCGary/sbx-kits
requires:
  agent: claude
setup:
  install:
    - command: |
        set -eu
        curl -fsSL https://raw.githubusercontent.com/rtk-ai/rtk/master/install.sh | sh
        rtk init -g --auto-patch < /dev/null
      user: "1000"
      description: Install rtk and register its PreToolUse hook
    - command: |
        set -eu
        claude plugin marketplace list | grep -q i-have-adhd \
          || claude plugin marketplace add ayghri/i-have-adhd
        claude plugin list | grep -q i-have-adhd \
          || claude plugin install i-have-adhd@i-have-adhd
      user: "1000"
      description: Install the i-have-adhd plugin
    - command: |
        set -eu
        claude plugin marketplace list | grep -q claude-plugins-official \
          || claude plugin marketplace add anthropics/claude-plugins-official
      user: "1000"
      description: Configure the official Claude Code marketplace
    - command: |
        set -eu
        claude plugin list | grep -q mattpocock-skills \
          || claude plugin install mattpocock-skills@claude-plugins-official
      user: "1000"
      description: Install the mattpocock-skills plugin
