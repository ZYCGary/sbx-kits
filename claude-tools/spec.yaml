schemaVersion: "2"
kind: mixin
name: claude-tools
version: 0.1.0
displayName: Claude agent tooling
description: Installs and initializes the tooling the Claude agent expects in-sandbox.
sourceURL: https://github.com/ZYCGary/sbx-kits
requires:
  agent: claude
# No permissions.network block on purpose. Hosts are added only after a real
# failure names them in `sbx policy log` — see the README.
setup:
  install:
    - command: "curl -fsSL https://raw.githubusercontent.com/rtk-ai/rtk/refs/heads/master/install.sh | sh"
      user: "1000"
      description: Install rtk
    - command: "rtk init -g"
      user: "1000"
      description: Register the rtk hook in the agent's Claude config
