schemaVersion: "2"
kind: mixin
name: claude-tools
version: 0.1.0
displayName: Claude agent tooling
description: Installs and initializes the tooling the Claude agent expects in-sandbox.
sourceURL: https://github.com/ZYCGary/sbx-kits
requires:
  agent: claude
# No permissions.network block on purpose. Hosts are added only after a real
# failure names them in `sbx policy log` — see the README.
setup:
  install:
    - description: Install rtk using the official installer
      command: |
        set -eu
        export RTK_INSTALL_DIR=/usr/local/bin
        curl -fsSL https://raw.githubusercontent.com/rtk-ai/rtk/refs/heads/master/install.sh | sh
    - description: Register the rtk hook in the agent's global Claude config
      user: "1000"
      command: rtk init -g
