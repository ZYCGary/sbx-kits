# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
version: "0.2.0"
displayName: pnpm package manager
description: Installs pnpm into the agent's npm global prefix.
sourceUrl: https://github.com/ZYCGary/sbx-kits
requires: ["node"]
capabilities:
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: |
            set -eu
            npm install -g pnpm
          user: "1000"
          env: [NPM_CONFIG_PREFIX]
          description: Install pnpm into the agent's npm global prefix
  - type: com.docker.sandbox/agent-context@1
    config:
      content: |
        ## pnpm

        `pnpm` is installed in the agent's npm global prefix and honours a repo's
        `packageManager` pin itself; corepack is not used. Project-level commands
        work, `pnpm add -g` does not — its global bin dir is not on `PATH`.
