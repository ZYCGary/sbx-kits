# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
version: "0.2.0"
displayName: Buf CLI
description: Installs the Buf CLI into the agent's npm global prefix and allowlists buf.build.
sourceUrl: https://github.com/ZYCGary/sbx-kits
requires: ["node"]
capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - buf.build
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: |
            set -eu
            npm install -g @bufbuild/buf
          user: "1000"
          env: [NPM_CONFIG_PREFIX]
          description: Install the Buf CLI into the agent's npm global prefix
  - type: com.docker.sandbox/agent-context@1
    config:
      content: |
        ## Buf CLI

        `buf` is installed from npm (`@bufbuild/buf`) into the agent's npm global
        prefix, so `buf lint`, `buf build`, `buf generate`, and `buf breaking` work
        without sudo. `buf.build` is allowlisted, so BSR-backed deps
        (`buf dep update`, `buf push`) resolve too; pushing needs a token the kit
        does not supply (`buf registry login`, or `BUF_TOKEN`).

        Plugins are a separate concern: remote plugins run on the BSR, local
        `protoc-gen-*` binaries are not installed by this kit.
